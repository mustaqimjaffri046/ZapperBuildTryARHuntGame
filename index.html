<!-- Zappar WebGL template with QR scanner integration -->
<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="favicon.ico">
    <title>HuntingGame</title>
    <style>
        html, body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            margin: 0;
        }
        canvas { display: block; }
        #unity-container {
            width: 360px;
            height: 640px;
            margin: 0 auto;
            position: relative;
        }
        #unity-canvas { width: 100%; height: 100%; background: #231F20; }
        #loading-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        #unity-progress-bar-empty {
            width: 80%; height: 24px; border: 1px solid white; padding: 2px; margin: 10px;
        }
        #unity-progress-bar-full { width: 0%; height: 100%; background: white; }
        .spinner, .spinner:after {
            border-radius: 50%; width: 5em; height: 5em;
        }
        .spinner {
            border-top: 1.1em solid rgba(255,255,255,0.2);
            border-right: 1.1em solid rgba(255,255,255,0.2);
            border-bottom: 1.1em solid rgba(255,255,255,0.2);
            border-left: 1.1em solid #fff;
            animation: spin 1.1s infinite linear;
        }
        @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }

        /* QR debug overlay */
        #qr-debug {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            padding: 10px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-family: sans-serif;
            font-size: 14px;
            text-align: center;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body class="dark">
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="qr-debug">QR Status: Waiting...</div>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <script src="https://libs.zappar.com/zappar-cv/2.1.9/zappar-cv.js"></script>

    <!-- QR SCANNER USING jsQR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        let qrScannerActive = false;
        let qrVideo = null;
        let qrStream = null;

        function StartQRScan() {
            if (qrScannerActive) return;
            qrScannerActive = true;

            const debugDiv = document.getElementById("qr-debug");
            debugDiv.innerText = "QR Status: Scanning...";

            qrVideo = document.createElement('video');
            qrVideo.setAttribute('playsinline', true);
            qrVideo.style.display = 'none';
            document.body.appendChild(qrVideo);

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    qrStream = stream;
                    qrVideo.srcObject = stream;
                    qrVideo.play();
                    scanLoop();
                })
                .catch(err => {
                    console.error("Camera error: ", err);
                    debugDiv.innerText = "QR Status: Camera error!";
                    qrScannerActive = false;
                });

            function scanLoop() {
                if (!qrScannerActive) return;
                if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
                    const canvas = document.createElement('canvas');
                    canvas.width = qrVideo.videoWidth;
                    canvas.height = qrVideo.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(qrVideo, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, canvas.width, canvas.height);

                    if (code) {
                        console.log("QR Detected:", code.data);
                        debugDiv.innerText = "QR Status: Scanned → " + code.data;

                        if (window.uarGameInstance) {
                            window.uarGameInstance.SendMessage("QRCodeScanner", "OnQRScanned", code.data);
                        }
                       
                        return;
                    }
                }
                requestAnimationFrame(scanLoop);
            }
        }

        
    </script>
    <!-- END QR SCANNER -->

    <script>
        var db = indexedDB.open("dummy_indexdb", 1); // iOS 14.6 fix

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/a9972641d9d205c2755447a68eb8746b.loader.js";
        const config = {
            dataUrl: buildUrl + "/00e1c5b24d056be9e2a2949c84e6f1e7.data",
            frameworkUrl: buildUrl + "/f4cd687e6e58f4ccde8faca1e7f9aaae.framework.js",
            codeUrl: buildUrl + "/16bc666d01a6d0d4dd4fa223eaf3b96b.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "MJ",
            productName: "HuntingGame",
            productVersion: "2.0",
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = window.devicePixelRatio;
        }
        loadingCover.style.display = "";

        window.zappar = ZCV.initialize();

        const script = document.createElement("script");
        script.src = loaderUrl;
        document.body.appendChild(script);

        window.zappar.permission_request_ui_promise().then(WaitForZCVLoad);

        function WaitForZCVLoad() {
            if (zappar.loaded()) {
                CreateUnityLoader();
                return;
            }
            setTimeout(WaitForZCVLoad, 500);
        }

        function CreateUnityLoader() {
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = `${100 * progress}%`;
            }).then((unityInstance) => {
                loadingCover.style.display = "none";
                window.uarGameInstance = unityInstance;
            }).catch((message) => {
                alert(message);
            });
        }
    </script>
</body>
</html>
