<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="favicon.ico">
    <title>HuntingGame</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #unity-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #231F20;
        }
        #loading-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: #000;
            z-index: 1000;
        }
        .spinner, .spinner:after {
            border-radius: 50%; width: 5em; height: 5em;
        }
        .spinner {
            border-top: 1.1em solid rgba(255,255,255,0.2);
            border-right: 1.1em solid rgba(255,255,255,0.2);
            border-bottom: 1.1em solid rgba(255,255,255,0.2);
            border-left: 1.1em solid #fff;
            animation: spin 1.1s infinite linear;
        }
        @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="loading-cover">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Zappar -->
    <script src="https://libs.zappar.com/zappar-cv/2.1.9/zappar-cv.js"></script>
    <!-- jsQR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <script>
        let qrScannerActive = false;
        let qrVideo = null;
        let qrStream = null;

        function StartQRScan() {
            if (qrScannerActive) return;
            qrScannerActive = true;

            // Notify Unity: scanning started
            if (window.uarGameInstance) {
                window.uarGameInstance.SendMessage("QRCodeScanner", "OnQRScanningStarted", "");
            }

            qrVideo = document.createElement('video');
            qrVideo.setAttribute('playsinline', true);
            qrVideo.style.display = 'none';
            document.body.appendChild(qrVideo);

            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    qrStream = stream;
                    qrVideo.srcObject = stream;
                    qrVideo.play();
                    scanLoop();
                })
                .catch(err => {
                    console.error("Camera error: ", err);
                    qrScannerActive = false;
                    if (window.uarGameInstance) {
                        window.uarGameInstance.SendMessage("QRCodeScanner", "OnQRScanningError", "Camera error!");
                    }
                });

            function scanLoop() {
                if (!qrScannerActive) return;

                if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
                    const canvas = document.createElement('canvas');
                    canvas.width = qrVideo.videoWidth;
                    canvas.height = qrVideo.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(qrVideo, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, canvas.width, canvas.height);

                    if (code) {
                        // Notify Unity: QR scanned
                        if (window.uarGameInstance) {
                            window.uarGameInstance.SendMessage("QRCodeScanner", "OnQRScanned", code.data);
                        }
                        StopQRScan();
                        return;
                    }
                }
                requestAnimationFrame(scanLoop);
            }
        }

        function StopQRScan() {
            if (!qrScannerActive) return;
            qrScannerActive = false;

            if (qrStream) {
                qrStream.getTracks().forEach(track => track.stop());
                qrStream = null;
            }
            if (qrVideo) {
                qrVideo.remove();
                qrVideo = null;
            }

            // Notify Unity: scanning stopped
            if (window.uarGameInstance) {
                window.uarGameInstance.SendMessage("QRCodeScanner", "OnQRScanningStopped", "");
            }
        }
    </script>

    <script>
        var db = indexedDB.open("dummy_indexdb", 1); // iOS 14.6 fix

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/06c194e11ae5b62215a23c35ee25243f.loader.js";
        const config = {
            dataUrl: buildUrl + "/a394c9fd089171cb0e507c0aa063a772.data",
            frameworkUrl: buildUrl + "/bf5e5b0c3f6f4887fe466cc5915060ec.framework.js",
            codeUrl: buildUrl + "/3a3aa11b486854aaf4bc40ec7a981a76.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "MJ",
            productName: "HuntingGame",
            productVersion: "2.0",
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const spinner = document.querySelector('.spinner');

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = window.devicePixelRatio;
        }

        window.zappar = ZCV.initialize();

        const script = document.createElement("script");
        script.src = loaderUrl;
        document.body.appendChild(script);

        window.zappar.permission_request_ui_promise().then(WaitForZCVLoad);

        function WaitForZCVLoad() {
            if (zappar.loaded()) {
                CreateUnityLoader();
                return;
            }
            setTimeout(WaitForZCVLoad, 500);
        }

        function CreateUnityLoader() {
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
            }).then((unityInstance) => {
                loadingCover.style.display = "none";
                window.uarGameInstance = unityInstance;
            }).catch((message) => {
                alert(message);
            });
        }
    </script>
</body>
</html>
